[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["__pycache__"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"src/core/utils.py" = ["F403", "F405"]
"src/models/__init__.py" = ["F403", "F405"]
"src/models/utilitis.py" = ["F403", "F405"]
"src/pruner/__init__.py" = ["F403"]
